{% extends "base.html" %}
{% block contenido %}
<div class="caja-cuenta">
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Entra con tu correo y tu contraseña</p>

    <form method="post">
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" placeholder="juan@gamehub.com" required>

        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" required>

        <button class="boton ancho" type="submit">Iniciar sesión</button>
    </form>

    <p class="cambiar">¿No tienes cuenta? <a href="{{ url_for('crear_cuenta') }}">Crear cuenta</a></p>
</div>
{% endblock %}
